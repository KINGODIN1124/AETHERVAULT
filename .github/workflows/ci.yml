name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 app cli.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 app cli.py --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Verify Key Engine & CLI Syntax
        run: |
          python -c "from app.core.key_engine import KeyEngine; engine = KeyEngine(master_secret='test_secret'); k = engine.create_api_key_from_session('CI-Test'); assert engine.verify_api_key(k['api_key'])[0] is True; print('Key Engine Verified Successfully!')"

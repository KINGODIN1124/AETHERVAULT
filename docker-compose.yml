version: '3.8'

services:
  aethervault-api:
    build: .
    container_name: aethervault-manifest-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UPSTREAM_SESSION_COOKIE=${UPSTREAM_SESSION_COOKIE}
      - UPSTREAM_EMAIL=${UPSTREAM_EMAIL}
      - UPSTREAM_PASSWORD=${UPSTREAM_PASSWORD}
      - API_MASTER_SECRET=${API_MASTER_SECRET}
      - STATIC_API_KEYS=${STATIC_API_KEYS}
      - PORT=8000
      - HOST=0.0.0.0
      - ENABLE_CACHE=true
      - ENABLE_ANTI_SCRAPING=true
      - ENABLE_FALLBACK_MIRRORS=true
    volumes:
      - ./cache_storage:/app/cache_storage
      - ./session_storage:/app/session_storage
      - ./keys.json:/app/keys.json
      - ./banned_ips.json:/app/banned_ips.json
